name: Evals

# Analytical-accuracy evals (Layer A). Scheduled + manual only — NOT part of the
# PR-blocking CI, since they download real data and are about football accuracy,
# not code correctness. Results are printed to the job log to track over time.
on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesdays 12:00 UTC (after the NFL week completes)
  workflow_dispatch: {}

# Least privilege for the GITHUB_TOKEN; jobs that publish widen it locally.
permissions:
  contents: read

jobs:
  projection-backtest:
    name: Projection accuracy backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run projection backtest
        run: |
          python -m evals.backtest.backtest --seasons 2023,2024 --start-week 5 --min-trailing 5

      - name: Run uncertainty calibration
        # Does the floor/ceiling band cover what it claims, and is the win
        # probability calibrated? Separate question from accuracy: a projection
        # can have a fine MAE and still lie about how sure it is.
        run: |
          python -m evals.backtest.calibration --seasons 2023,2024 --start-week 5

      - name: Metric unit tests
        # pytest-asyncio is required even for a sync-only test file: pyproject
        # sets `asyncio_mode = "auto"`, and plain pytest aborts with
        # `Unknown config option: asyncio_mode` (exit 4).
        run: |
          pip install pytest pytest-asyncio
          pytest tests/test_eval_metrics.py tests/test_eval_calibration.py -q

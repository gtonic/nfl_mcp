name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}  # allow manual "build & publish" runs

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

  typecheck:
    name: Type check (mypy, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      # Non-blocking: mypy is a signal while the codebase is progressively
      # typed, not a merge gate. Surfaces real type bugs without failing CI.
      - name: mypy
        run: mypy nfl_mcp
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The pinned lock file -- the exact set the Docker image ships -- so a
      # green run means the deployed dependency versions were tested.
      - name: Install dependencies (requirements.lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -q --cov=nfl_mcp --cov-report=term-missing

  test-loose:
    name: Tests (latest allowed ranges, optional)
    runs-on: ubuntu-latest
    # Early warning for the next lock bump: resolves requirements.txt's ranges
    # to the newest releases. Informational, not a merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (requirements.txt ranges)
        run: |
          python -m pip install --upgrade pip
          pip install --pre -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -q

  docker:
    name: Build & publish image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Smoke test the real image before anything is pushed: it must start,
      # answer /health (immediately -- startup prefetch runs in the
      # background) and list tools over MCP.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: nfl-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container (/health + tools/list)
        run: |
          docker run -d --name nfl-mcp-smoke -p 9000:9000 nfl-mcp:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/health -o /tmp/health.json; then break; fi
            sleep 1
          done
          echo "--- /health"; cat /tmp/health.json; echo
          python3 -c "import json,sys; b=json.load(open('/tmp/health.json')); sys.exit(0 if b['status'] in ('healthy','degraded') and b['version'] not in ('unknown','') else 1)"
          echo "--- tools/list"
          curl -fsS -X POST http://localhost:9000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' -o /tmp/tools.txt
          head -c 400 /tmp/tools.txt; echo
          grep -q '"get_nfl_news"' /tmp/tools.txt

      - name: Container logs (on failure)
        if: failure()
        run: docker logs nfl-mcp-smoke || true

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Only log in / push for real refs (not pull requests from forks/branches).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Build on every run (validates the Dockerfile on PRs); push only on
          # branch/tag pushes, so main and version tags publish an image.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

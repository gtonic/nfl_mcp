[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl_mcp"
version = "0.6.7"
description = "NFL MCP Server - Fantasy Football Analysis via Model Context Protocol"
authors = [{name = "gtonic", email = "tom.geiger@alp54.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.4.4",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "aiosqlite>=0.22.1",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/gtonic/nfl_mcp"
Repository = "https://github.com/gtonic/nfl_mcp"
Issues = "https://github.com/gtonic/nfl_mcp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nfl_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
addopts = ["--strict-markers", "--strict-config", "-v"]
markers = [
    "live: test hits a real external API (Sleeper/ESPN); skipped unless --run-live is passed",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["FastMCP.txt", "*.egg-info", "docs", "examples"]

[tool.ruff.lint]
# Correctness core (F/B/I) plus, after the debt cleanup, whitespace (E/W),
# pyupgrade modernization (UP), simplifications (SIM), comprehensions (C4),
# misc (PIE), Ruff-native checks (RUF) and timezone-aware datetimes (DTZ).
select = ["F", "B", "I", "E", "W", "UP", "SIM", "C4", "PIE", "RUF", "DTZ"]
ignore = [
    "E501",   # line length — legacy long lines aren't worth reflowing
    # Ambiguous-unicode: this project is full of emoji + docstrings; the
    # warnings are noise here, not real homoglyph risks.
    "RUF001", "RUF002", "RUF003",
    # Blind `except Exception` is a deliberate best-effort pattern across the
    # enrichment/fetch paths (graceful fallback); narrowing 160+ sites would
    # change behavior. Not enforced (would be false-positive-heavy).
    "BLE001",
    # Manual-only style nits left after the auto-fix sweep. The *auto-fixable*
    # members of these families (whitespace, pyupgrade, comprehensions, f-strings,
    # …) ARE enforced; these specific hand-edit rules are deferred to targeted
    # cleanups (and mostly superseded by the planned type-checker pass).
    "E402",   # module-import-not-at-top (intentional lazy/conditional imports)
    "E702",   # multi-statement semicolons (existing one-liner idiom)
    "E741",   # ambiguous var names (l/O) in a few spots
    "DTZ005", # naive datetime.now() (used for .year / cache-age — harmless)
    "RUF012", # mutable class defaults (constants, never mutated)
    "RUF059", # unused unpacked variable
    "SIM102", "SIM105", "SIM108", "SIM115", "SIM116", "SIM117",  # collapsible/style
    "C401",   # unnecessary generator
    "PIE810", # multiple startswith/endswith
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are intentional, not dead imports.
"__init__.py" = ["F401"]
# All B023 hits here are enrichment closures defined AND consumed within the
# same retry-loop iteration (captured vars are re-bound each pass), so they are
# false positives. (get_rosters stays in sleeper_tools; get_transactions' copies
# moved to sleeper_transactions in the domain split.)
"nfl_mcp/sleeper_tools.py" = ["B023"]
"nfl_mcp/sleeper_transactions.py" = ["B023"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
# Report-only signal, not a gate (the CI job is non-blocking). This is a
# dict-heavy, progressively-typed codebase, so some inference noise is expected;
# the value is catching real type bugs (e.g. attribute typos, None misuse).
check_untyped_defs = true

[tool.coverage.run]
source = ["nfl_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]